<svg xmlns="http://www.w3.org/2000/svg" version="1.0" width="1024pt" height="665pt" viewBox="0 0 1024 665" preserveAspectRatio="xMidYMid meet">
  <!-- Lit eyes of logo-gray.svg. Layered on top of it and faded in/out by CSS. -->
  <defs>
    <!-- Lens: brighter center, darker rim instead of a flat disc -->
    <radialGradient id="lens" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#139c13" />
      <stop offset="70%" stop-color="#0b8a0b" />
      <stop offset="100%" stop-color="#056605" />
    </radialGradient>
    <!-- Soft outer glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur" />
      <feFlood flood-color="#22c55e" flood-opacity="0.35" />
      <feComposite in2="blur" operator="in" result="halo" />
      <feMerge>
        <feMergeNode in="halo" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <g transform="matrix(0.1,0,0,-0.1,0,665)" fill="url(#lens)">
      <path d="m 4405.2649,3831.7765 a 556.38546,556.38546 0 0 0 -556.3855,-556.3855 556.38546,556.38546 0 0 0 -556.3855,556.3855 556.38546,556.38546 0 0 0 556.3855,556.3854 556.38546,556.38546 0 0 0 556.3855,-556.3854 z" />
      <path d="m 6909.5722,3837.9538 a 556.38546,556.38546 0 0 0 -556.3855,-556.3854 556.38546,556.38546 0 0 0 -556.3855,556.3854 556.38546,556.38546 0 0 0 556.3855,556.3855 556.38546,556.38546 0 0 0 556.3855,-556.3855 z" />
    </g>
  </g>
